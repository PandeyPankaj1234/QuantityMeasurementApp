spring.application.name=quantity-measurement-app

# ─── Database (H2 in-memory) ──────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── API Docs ─────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.org.springframework.web=INFO

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=dGVzdGRHVnpkR1JsYzNSbFpHVnlkR2x1WjNOaFkzSmxkR2x2YmkxclpYaz0
app.jwt.expiration=86400000

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8082
spring.profiles.active=dev

# ─── Google OAuth2 ────────────────────────────────────────────────────────────
# IMPORTANT: Set these two values before running, or export as environment variables:
#   export GOOGLE_CLIENT_ID=your-client-id
#   export GOOGLE_CLIENT_SECRET=your-client-secret
#
# Get credentials from: https://console.cloud.google.com/apis/credentials
# Authorized redirect URI to add in Google Console:
#   http://localhost:8082/login/oauth2/code/google

spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8082/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
